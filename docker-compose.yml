services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-hunter-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://job_hunter:job_hunter_dev@postgres:5432/job_hunter
      REDIS_URL: redis://redis:6379
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: job-hunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_hunter
      POSTGRES_PASSWORD: job_hunter_dev
      POSTGRES_DB: job_hunter
    ports:
      - "5432:5432"
    volumes:
      - job_hunter_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunter -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: job-hunter-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - job_hunter_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  job_hunter_postgres_data:
  job_hunter_redis_data:
